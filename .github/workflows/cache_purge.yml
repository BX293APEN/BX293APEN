name: Purge Camo Cache

on:
  push:                       # push時に実行
    branches:
      - main                  # mainブランチにpushされた時のみ
  workflow_dispatch:          # 手動実行
  schedule:
    - cron: "*/30 * * * *"    # 30分毎に実行

#            ┌───────────── 分 (0 - 59)
#            │ ┌───────────── 時 (0 - 23)
#            │ │ ┌───────────── 日 (1 - 31)
#            │ │ │ ┌───────────── 月 (1 - 12)
#            │ │ │ │ ┌───────────── 曜日 (0 - 6)  ※0=日曜
#            │ │ │ │ │
#   - cron: "* * * * *"


jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run purge script
        run: node src/cache_purge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
